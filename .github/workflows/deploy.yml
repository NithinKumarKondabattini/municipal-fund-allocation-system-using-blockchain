name: Deploy
on: {push: {branches: [main]}}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy by SSH
        uses: appleboy/ssh-action@v1.2.0
        with: {host: '${{ secrets.DEPLOY_HOST }}', username: '${{ secrets.DEPLOY_USER }}', key: '${{ secrets.DEPLOY_KEY }}', script: 'bash /opt/municipal-fund/devops/deploy.sh'}
