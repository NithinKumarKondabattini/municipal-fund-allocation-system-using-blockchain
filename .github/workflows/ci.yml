name: CI
on: [push,pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --prefix backend && npm test --prefix backend
      - run: npm install --prefix frontend && npm run build --prefix frontend
      - run: npm install --prefix blockchain && npm test --prefix blockchain
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r ai-service/requirements.txt && pytest ai-service/tests
