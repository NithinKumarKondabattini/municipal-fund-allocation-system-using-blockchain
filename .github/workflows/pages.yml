name: Deploy Public Portal to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
        env:
          # With no hosted API, Pages remains a complete read-only public demo.
          # Set repository variable PUBLIC_API_URL to https://your-service/api
          # to turn Pages into a live frontend for the hosted Express API.
          VITE_API_URL: ${{ vars.PUBLIC_API_URL }}
          VITE_STATIC_DEMO: ${{ vars.PUBLIC_API_URL == '' && 'true' || 'false' }}
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v3
        with: {path: frontend/dist}
      - id: deployment
        uses: actions/deploy-pages@v4
