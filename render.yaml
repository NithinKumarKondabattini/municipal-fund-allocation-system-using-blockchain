services:
  - type: web
    name: municipal-fund-allocation-system-using-blockchain
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend && npm run seed --prefix backend
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_FILE
        value: ./backend/data/municipal.db
      - key: UPLOAD_DIR
        value: ./backend/uploads
